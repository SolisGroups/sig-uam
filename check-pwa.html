<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vérificateur PWA - SIG Web UAM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .checker-container {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .check-item {
            padding: 15px;
            margin: 10px 0;
            border-left: 4px solid #ccc;
            border-radius: 5px;
            background: #f8f9fa;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .check-item.passed {
            border-left-color: #28a745;
            background: #d4edda;
        }

        .check-item.failed {
            border-left-color: #dc3545;
            background: #f8d7da;
        }

        .check-item.warning {
            border-left-color: #ffc107;
            background: #fff3cd;
        }

        .check-icon {
            font-size: 24px;
            min-width: 30px;
            text-align: center;
        }

        .check-content {
            flex: 1;
        }

        .check-title {
            font-weight: 600;
            margin-bottom: 5px;
        }

        .check-desc {
            font-size: 13px;
            opacity: 0.8;
            margin: 0;
        }

        .summary {
            margin-top: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 10px;
            text-align: center;
        }

        .summary h3 {
            margin: 0 0 10px 0;
        }

        .score {
            font-size: 32px;
            font-weight: bold;
            margin: 10px 0;
        }

        .spinner {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .badge-custom {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
            margin-top: 5px;
        }
    </style>
</head>

<body>
    <div class="checker-container">
        <h1 class="mb-4 text-center">
            <i class="fas fa-check-circle"></i> Vérificateur PWA
        </h1>
        <p class="text-muted text-center mb-4">Vérification de la configuration PWA de SIG Web UAM</p>

        <div id="checks-container">
            <div class="text-center">
                <i class="fas fa-spinner spinner"></i>
                <p>Vérification en cours...</p>
            </div>
        </div>

        <div id="summary" class="summary" style="display:none;">
            <h3>Résultat de la vérification</h3>
            <div class="score" id="score">0/10</div>
            <p id="status" class="mb-0">En attente</p>
        </div>
    </div>

    <script>
        const checks = [
            {
                name: 'Manifest disponible',
                test: async () => {
                    try {
                        const response = await fetch('manifest.json');
                        return response.ok;
                    } catch (e) {
                        return false;
                    }
                }
            },
            {
                name: 'Service Worker enregistré',
                test: async () => {
                    return 'serviceWorker' in navigator;
                }
            },
            {
                name: 'Service Worker actif',
                test: async () => {
                    if (!('serviceWorker' in navigator)) return false;
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    return registrations.length > 0;
                }
            },
            {
                name: 'HTTPS (ou localhost)',
                test: async () => {
                    return location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
                }
            },
            {
                name: 'Métadonnée theme-color',
                test: async () => {
                    return !!document.querySelector('meta[name="theme-color"]');
                }
            },
            {
                name: 'Icône App disponible',
                test: async () => {
                    try {
                        const response = await fetch('img/icons/icon-192x192.png');
                        return response.ok;
                    } catch (e) {
                        return false;
                    }
                }
            },
            {
                name: 'Métadonnée viewport',
                test: async () => {
                    return !!document.querySelector('meta[name="viewport"]');
                }
            },
            {
                name: 'Géolocalisation supportée',
                test: async () => {
                    return 'geolocation' in navigator;
                }
            },
            {
                name: 'localStorage disponible',
                test: async () => {
                    try {
                        localStorage.test = 'test';
                        localStorage.removeItem('test');
                        return true;
                    } catch (e) {
                        return false;
                    }
                }
            },
            {
                name: 'Installable PWA (Manifest complet)',
                test: async () => {
                    try {
                        const response = await fetch('manifest.json');
                        const manifest = await response.json();
                        const required = ['name', 'icons', 'start_url', 'display'];
                        return required.every(key => key in manifest);
                    } catch (e) {
                        return false;
                    }
                }
            }
        ];

        async function runChecks() {
            const container = document.getElementById('checks-container');
            const summary = document.getElementById('summary');
            container.innerHTML = '';

            let passed = 0;
            let total = checks.length;

            for (const check of checks) {
                const div = document.createElement('div');
                div.className = 'check-item';
                div.innerHTML = `
                    <div class="check-icon">
                        <i class="fas fa-spinner spinner"></i>
                    </div>
                    <div class="check-content">
                        <div class="check-title">${check.name}</div>
                        <p class="check-desc">Vérification en cours...</p>
                    </div>
                `;
                container.appendChild(div);

                try {
                    const result = await check.test();
                    const icon = result ?
                        '<i class="fas fa-check-circle text-success"></i>' :
                        '<i class="fas fa-times-circle text-danger"></i>';

                    div.className = `check-item ${result ? 'passed' : 'failed'}`;
                    div.innerHTML = `
                        <div class="check-icon">
                            ${icon}
                        </div>
                        <div class="check-content">
                            <div class="check-title">${check.name}</div>
                            <p class="check-desc">${result ? '✓ Réussi' : '✗ Échoué'}</p>
                        </div>
                    `;

                    if (result) passed++;
                } catch (e) {
                    div.className = 'check-item warning';
                    div.innerHTML = `
                        <div class="check-icon">
                            <i class="fas fa-exclamation-circle text-warning"></i>
                        </div>
                        <div class="check-content">
                            <div class="check-title">${check.name}</div>
                            <p class="check-desc">⚠️ Erreur: ${e.message}</p>
                        </div>
                    `;
                }
            }

            // Afficher le résumé
            document.getElementById('score').textContent = `${passed}/${total}`;
            const status = document.getElementById('status');

            if (passed === total) {
                status.innerHTML = '<i class="fas fa-check-circle"></i> Tous les tests sont passés! L\'application est prête pour PWA.';
            } else if (passed >= 8) {
                status.innerHTML = '<i class="fas fa-info-circle"></i> Bonne configuration. Quelques améliorations recommandées.';
            } else {
                status.innerHTML = '<i class="fas fa-exclamation-circle"></i> Configuration insuffisante. Consultez le guide d\'installation.';
            }

            summary.style.display = 'block';
        }

        // Lancer les vérifications au chargement
        window.addEventListener('load', runChecks);
    </script>
</body>

</html>
